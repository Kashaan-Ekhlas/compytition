name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compytition
          POSTGRES_PASSWORD: compytition
          POSTGRES_DB: compytition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compytition -d compytition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://compytition:compytition@localhost:5432/compytition?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Migrate up, down, up
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate -down
          go run ./cmd/migrate
      - name: Seed demo data
        run: go run ./cmd/seed

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_API_BASE: /api/v1
